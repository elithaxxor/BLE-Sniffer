<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Bluetooth Device Logs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 8px;
            border: 1px solid #ccc;
        }
        th {
            background-color: #f0f0f0;
        }
        tr:nth-child(even) {
            background-color: #fafafa;
        }
    </style>
</head>
<body>
<h1>Bluetooth Device Logs</h1>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Timestamp</th>
        <th>MAC Address</th>
        <th>Device Name</th>
        <th>Vendor</th>
        <th>Extra Info</th>
    </tr>
    </thead>
    <tbody>
    {% for device in devices %}
    <tr>
        <td>{{ device.id }}</td>
        <td>{{ device.timestamp }}</td>
        <td>{{ device.mac_address }}</td>
        <td>{{ device.device_name }}</td>
        <td>{{ device.vendor }}</td>
        <td><pre>{{ device.extra_info }}</pre></td>
    </tr>
    {% else %}
    <tr>
        <td colspan="6">No devices logged.</td>
    </tr>
    {% endfor %}
    </tbody>
</table>
</body>
</html>
